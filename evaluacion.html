<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Transporte - IUSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- BARRA DE NAVEGACIÓN UNIFICADA -->
<nav class="bg-slate-900 text-white shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-extrabold px-2.5 py-1 rounded text-sm tracking-wider">IUSA</div>
            <span class="font-bold text-lg tracking-wide text-slate-100">Control Logístico de Transporte</span>
        </div>
        <div class="flex space-x-2 text-sm font-medium">
            <a href="/" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">📊 Procesador Excel</a>
            <a href="/reportes.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">📝 Buzón de Quejas</a>
            <a href="/qr_generator.html" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">📷 Generador QR</a>
        </div>
    </div>
</nav>

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        
        <!-- ENCABEZADO -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-6 text-center">
            <h1 class="text-xl font-bold tracking-wide">Gestión de Transporte</h1>
            <p class="text-xs text-blue-200 font-medium">IUSA TRANSPORTES</p>
        </div>

        <!-- TARJETA INFORMACIÓN DEL CAMIÓN -->
        <div class="p-5">
            <div id="bus-card" class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase">Unidad Detectada</span>
                    <span id="badge-camion" class="text-xs px-2.5 py-0.5 rounded-full font-bold bg-blue-100 text-blue-800">Cargando...</span>
                </div>
                <div class="space-y-1 text-sm">
                    <p class="text-slate-700"><strong>Número de Camión:</strong> <span id="lbl-camion" class="font-bold text-slate-900">--</span></p>
                    <p class="text-slate-700"><strong>Nombre del Chofer:</strong> <span id="lbl-chofer" class="font-semibold text-blue-700">Buscando en base de datos...</span></p>
                    <p class="text-slate-700"><strong>Empresa:</strong> <span id="lbl-empresa" class="text-slate-600">--</span></p>
                </div>
            </div>

            <!-- FORMULARIO DE EVALUACIÓN -->
            <form id="form-evaluacion" class="space-y-4">
                
                <!-- CREDENCIAL -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. Credencial del Colaborador:</label>
                    <input type="text" id="num-credencial" required placeholder="Ingresa tu número de credencial (ej. 08001986)" 
                           class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- TIPO DE REGISTRO -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. Tipo de Registro:</label>
                    <select id="tipo-envio" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Calificación (Estrellas)">Calificación (Estrellas)</option>
                        <option value="Queja / Reporte">Queja / Reporte de Servicio</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                </div>

                <!-- ESTRELLAS DE PUNTUACIÓN -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. Puntuación:</label>
                    <div class="flex items-center justify-center space-x-2 py-1" id="stars-container">
                        <button type="button" onclick="setRating(1)" class="star-btn text-3xl text-slate-300 transition-colors">★</button>
                        <button type="button" onclick="setRating(2)" class="star-btn text-3xl text-slate-300 transition-colors">★</button>
                        <button type="button" onclick="setRating(3)" class="star-btn text-3xl text-slate-300 transition-colors">★</button>
                        <button type="button" onclick="setRating(4)" class="star-btn text-3xl text-slate-300 transition-colors">★</button>
                        <button type="button" onclick="setRating(5)" class="star-btn text-3xl text-slate-300 transition-colors">★</button>
                    </div>
                </div>

                <!-- COMENTARIOS -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Comentario u Observación:</label>
                    <textarea id="comentario" rows="3" placeholder="Escribe aquí tu opinión o reporte..." 
                              class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <!-- MENSAJE DE ESTADO -->
                <div id="status-msg" class="hidden text-xs p-3 rounded-lg font-medium text-center"></div>

                <!-- BOTÓN DE ENVÍO -->
                <button type="submit" id="btn-submit" 
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm">
                    Enviar Registro
                </button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DIRECTA DE TU PROYECTO SUPABASE
        const SUPABASE_URL = 'https://jjfcesrsexuxyamoghsx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tkHpyaqmhlm8HuQvcVwzPg_Q0hehaPF  '; // Reemplazar con tu Anon Key completa si es diferente

        const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedRating = 5;
        let idCamionActual = '02'; // Por defecto para pruebas

        // Detectar parámetro ?id_camion= de la URL (cuando escanean el QR)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('id_camion')) {
            idCamionActual = urlParams.get('id_camion').trim();
        } else if (urlParams.has('id')) {
            idCamionActual = urlParams.get('id').trim();
        }

       // Cargar información de la unidad al abrir la página
async function cargarReportes() {
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400 font-medium">Cargando reportes desde Supabase...</td></tr>';

    try {
        // Consultamos directamente la tabla reportes_recibidos
        const { data, error } = await clientSupabase
            .from('reportes_recibidos')
            .select('*');

        if (error) {
            console.error("Error Supabase:", error);
            tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-500 font-medium">❌ Error Supabase: ${error.message || JSON.stringify(error)}</td></tr>`;
            return;
        }

        listaReportesOriginal = data || [];
        actualizarKPIs(listaReportesOriginal);
        renderTabla(listaReportesOriginal);

    } catch (err) {
        console.error("Excepción al cargar:", err);
        tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-500 font-medium">❌ Error inesperado: ${err.message || err}</td></tr>`;
    }
}

        // Manejo interactivo de estrellas
        function setRating(val) {
            selectedRating = val;
            const stars = document.querySelectorAll('.star-btn');
            stars.forEach((star, idx) => {
                if (idx < val) {
                    star.classList.remove('text-slate-300');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-slate-300');
                }
            });
        }

        // Envío del formulario a Supabase
        document.getElementById('form-evaluacion').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const numCredencial = document.getElementById('num-credencial').value.trim();
            const tipoEnvio = document.getElementById('tipo-envio').value;
            const comentario = document.getElementById('comentario').value.trim();
            const btnSubmit = document.getElementById('btn-submit');
            const statusMsg = document.getElementById('status-msg');

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando e insertando...';
            statusMsg.className = 'hidden';

            try {
                // 1. Validar que la credencial exista en 'credenciales_validas'
const { data: credData, error: credErr } = await clientSupabase
    .from('credenciales_validas')
    .select('*')
    .eq('numero_credencial', numCredencial);

if (credErr || !credData || credData.length === 0) {
    statusMsg.textContent = '❌ La credencial ingresada no se encuentra registrada o activa.';
    statusMsg.className = 'text-xs p-3 rounded-lg font-medium text-center bg-red-100 text-red-700 block';
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Enviar Registro';
    return;
}

                // 2. Generar folio único
                const folio = 'REP-' + Math.floor(100000 + Math.random() * 900000);

                // 3. Insertar registro en 'reportes_recibidos'
                const { error: insertErr } = await clientSupabase
                    .from('reportes_recibidos')
                    .insert([{
                        folio_reporte: folio,
                        fecha_hora: new Date().toISOString(),
                        id_camion: idCamionActual,
                        credencial_emisor: numCredencial,
                        tipo_envio: tipoEnvio,
                        puntuacion: selectedRating.toString(),
                        etiqueta: tipoEnvio,
                        comentario: comentario,
                        estatus: 'Activo'
                    }]);

                if (insertErr) {
                    throw insertErr;
                }

                // Éxito
                statusMsg.textContent = `✅ ¡Registro enviado exitosamente con folio ${folio}!`;
                statusMsg.className = 'text-xs p-3 rounded-lg font-medium text-center bg-emerald-100 text-emerald-700 block';
                document.getElementById('comentario').value = '';
                
            } catch (err) {
                statusMsg.textContent = '❌ Error al guardar el registro en Supabase: ' + (err.message || err);
                statusMsg.className = 'text-xs p-3 rounded-lg font-medium text-center bg-red-100 text-red-700 block';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Enviar Registro';
            }
        });

        // Inicializar
        setRating(5);
        cargarInfoUnidad();
    </script>
</body>
</html>
