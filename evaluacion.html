<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Transporte - IUSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden my-auto">
        
        <div class="bg-indigo-900 text-white p-5 text-center shadow-inner">
            <h1 class="text-xl font-extrabold tracking-wide">Gestión de Transporte</h1>
            <p class="text-xs text-indigo-200 tracking-wider font-semibold uppercase mt-0.5">IUSA TRANSPORTES</p>
        </div>

        <div class="p-5 space-y-4">
            
            <!-- DATOS DEL CAMIÓN -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs space-y-1.5 relative">
                <span id="badge-camion" class="absolute top-3 right-3 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full">Buscando...</span>
                <p class="text-slate-400 font-bold uppercase tracking-wider text-[10px]">UNIDAD DETECTADA</p>
                <p class="text-slate-700"><strong>Número de Camión:</strong> <span id="lbl-camion" class="font-bold text-slate-900">--</span></p>
                <p class="text-slate-700"><strong>Nombre del Chofer:</strong> <span id="lbl-chofer" class="font-bold text-blue-900">Buscando en base de datos...</span></p>
                <p class="text-slate-700"><strong>Empresa:</strong> <span id="lbl-empresa" class="text-slate-600">--</span></p>
            </div>

            <!-- FORMULARIO -->
            <form id="form-evaluacion" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. Credencial del Colaborador:</label>
                    <div id="contenedor-lector" class="space-y-2">
                        <button type="button" onclick="simularEscaneo()" class="w-full py-2.5 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl text-xs flex items-center justify-center space-x-2 shadow transition">
                            <span>📷 Escanear Código de Barras</span>
                        </button>
                        <div class="text-center">
                            <a href="#" onclick="habilitarManual(event)" class="text-[11px] text-blue-600 hover:underline font-semibold">¿Credencial dañada? Capturar manualmente</a>
                        </div>
                    </div>
                    <div id="contenedor-manual" class="hidden">
                        <input type="text" id="input-credencial" placeholder="Ingresa número de credencial" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. PIN de Seguridad (4 dígitos):</label>
                    <input type="password" id="input-pin" maxlength="4" required placeholder="****" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm tracking-widest text-center font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <p class="text-[10px] text-slate-500 mt-1 text-center">Si es tu primer uso, el PIN que ingreses se registrará como tu clave personal.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. Tipo de Registro:</label>
                    <select id="select-tipo" onchange="cambiarTipoRegistro()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Calificación (Estrellas)">Calificación (Estrellas)</option>
                        <option value="Queja / Reporte">Queja / Reporte</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                </div>

                <!-- CONTENEDOR DINÁMICO (ESTRELLAS O COMENTARIO) -->
                <div id="seccion-estrellas">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Puntuación:</label>
                    <div class="flex justify-center space-x-2 text-3xl text-slate-300 cursor-pointer py-1" id="star-rating">
                        <span onclick="setRating(1)" class="star transition">★</span>
                        <span onclick="setRating(2)" class="star transition">★</span>
                        <span onclick="setRating(3)" class="star transition">★</span>
                        <span onclick="setRating(4)" class="star transition">★</span>
                        <span onclick="setRating(5)" class="star transition">★</span>
                    </div>
                </div>

                <div id="seccion-comentario" class="hidden">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Detalle de la Incidencia / Sugerencia:</label>
                    <textarea id="input-comentario" rows="3" placeholder="Describe aquí los detalles..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <div id="msg-alerta" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

                <button type="submit" id="btn-enviar" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition duration-200">
                    Enviar Registro
                </button>

            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjfcesrsexuxyamoghsx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tkHpyaqmhlm8HuQvcVwzPg_Q0hehaPF';
        const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedRating = 5;
        let idCamionActual = '02';
        let credencialEscaneada = '08001986'; // Predeterminada para pruebas del escáner

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('id_camion')) {
            idCamionActual = urlParams.get('id_camion').trim();
        }

        setRating(5);

        function setRating(rating) {
            selectedRating = rating;
            document.querySelectorAll('.star').forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('text-amber-400');
                    star.classList.remove('text-slate-300');
                } else {
                    star.classList.add('text-slate-300');
                    star.classList.remove('text-amber-400');
                }
            });
        }

        function simularEscaneo() {
            // Simula la lectura rápida del código de barras de la credencial
            credencialEscaneada = prompt("Simulador de Escáner de Credencial:\nIngresa o escanea el número de credencial:", "08001986");
            if (credencialEscaneada) {
                document.getElementById('contenedor-lector').innerHTML = `<div class="p-2 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-bold text-center">✔ Credencial Lecturada: ${credencialEscaneada}</div>`;
            }
        }

        function habilitarManual(e) {
            e.preventDefault();
            document.getElementById('contenedor-lector').classList.add('hidden');
            document.getElementById('contenedor-manual').classList.remove('hidden');
            credencialEscaneada = null;
        }

        function cambiarTipoRegistro() {
            const tipo = document.getElementById('select-tipo').value;
            if (tipo === 'Calificación (Estrellas)') {
                document.getElementById('seccion-estrellas').classList.remove('hidden');
                document.getElementById('seccion-comentario').classList.add('hidden');
            } else {
                document.getElementById('seccion-estrellas').classList.add('hidden');
                document.getElementById('seccion-comentario').classList.remove('hidden');
            }
        }

        async function obtenerDatosCamion() {
            try {
                const { data } = await clientSupabase.from('choferes_unidades').select('*').eq('id_camion', idCamionActual).maybeSingle();
                if (data) {
                    document.getElementById('lbl-camion').textContent = data.id_camion;
                    document.getElementById('lbl-chofer').textContent = data.nombre_chofer || 'Sin chofer asignado';
                    document.getElementById('lbl-empresa').textContent = data.empresa || 'IUSA Transportes';
                    document.getElementById('badge-camion').textContent = `Camión ${data.id_camion}`;
                } else {
                    document.getElementById('lbl-camion').textContent = idCamionActual;
                    document.getElementById('lbl-chofer').textContent = 'Información no registrada';
                }
            } catch (err) {
                document.getElementById('lbl-camion').textContent = idCamionActual;
            }
        }

        document.getElementById('form-evaluacion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const msg = document.getElementById('msg-alerta');
            
            const credencial = credencialEscaneada || document.getElementById('input-credencial')?.value.trim();
            const pinIngresado = document.getElementById('input-pin').value.trim();
            const tipoRegistro = document.getElementById('select-tipo').value;

            if (!credencial) {
                alert("Por favor escanea o ingresa tu número de credencial.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Verificando en Base de Datos...";
            msg.className = "hidden";

            try {
                // 1. Verificar si la credencial existe en credenciales_validas
                const { data: userRecord, error: errUser } = await clientSupabase
                    .from('credenciales_validas')
                    .select('*')
                    .eq('num_credencial', credencial)
                    .maybeSingle();

                if (errUser || !userRecord) {
                    throw new Error("El número de credencial no se encuentra registrado en el padrón autorizado de IUSA.");
                }

                // 2. Validar o Registrar el PIN de 4 dígitos por primera vez
                if (!userRecord.pin_seguridad) {
                    // Es su primer uso, guardamos el PIN ingresado en la base de datos
                    await clientSupabase
                        .from('credenciales_validas')
                        .update({ pin_seguridad: pinIngresado })
                        .eq('num_credencial', credencial);
                } else {
                    // Ya tiene PIN, validamos que coincida
                    if (userRecord.pin_seguridad !== pinIngresado) {
                        throw new Error("El PIN de seguridad ingresado es incorrecto.");
                    }
                }

                // 3. Insertar el reporte en reportes_recibidos
                btn.textContent = "Guardando reporte...";
                const folio = "REP-" + Math.floor(100000 + Math.random() * 900000);
                const comentarioTexto = tipoRegistro === 'Calificación (Estrellas)' 
                    ? (selectedRating === 5 ? 'Sin comentarios' : 'Calificación con ' + selectedRating + ' estrellas')
                    : document.getElementById('input-comentario').value.trim();

                const { error: errInsert } = await clientSupabase
                    .from('reportes_recibidos')
                    .insert([{
                        folio_reporte: folio,
                        id_camion: idCamionActual,
                        credencial_emisor: credencial,
                        tipo_envio: tipoRegistro,
                        puntuacion: tipoRegistro === 'Calificación (Estrellas)' ? selectedRating : 0,
                        comentario: comentarioTexto || 'Sin detalle',
                        fecha_hora: new Date().toISOString()
                    }]);

                if (errInsert) throw errInsert;

                msg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-emerald-100 text-emerald-800 block";
                msg.textContent = `¡Registro enviado con éxito! Folio: ${folio}`;
                document.getElementById('form-evaluacion').reset();
                credencialEscaneada = null;

            } catch (err) {
                msg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-red-100 text-red-700 block";
                msg.textContent = "❌ " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar Registro";
            }
        });

        obtenerDatosCamion();
    </script>
</body>
</html>
