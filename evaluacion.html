<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Transporte - IUSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- CONTENEDOR TARJETA MÓVIL PERFECTAMENTE CENTRADA -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden my-auto">
        
        <!-- ENCABEZADO -->
        <div class="bg-indigo-900 text-white p-5 text-center shadow-inner">
            <h1 class="text-xl font-extrabold tracking-wide">Gestión de Transporte</h1>
            <p class="text-xs text-indigo-200 tracking-wider font-semibold uppercase mt-0.5">IUSA TRANSPORTES</p>
        </div>

        <div class="p-5 space-y-4">
            
            <!-- TARJETA UNIDAD DETECTADA -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs space-y-1.5 relative">
                <span id="badge-camion" class="absolute top-3 right-3 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                    Buscando...
                </span>
                <p class="text-slate-400 font-bold uppercase tracking-wider text-[10px]">UNIDAD DETECTADA</p>
                <p class="text-slate-700"><strong>Número de Camión:</strong> <span id="lbl-camion" class="font-bold text-slate-900">--</span></p>
                <p class="text-slate-700"><strong>Nombre del Chofer:</strong> <span id="lbl-chofer" class="font-bold text-blue-900">Buscando en base de datos...</span></p>
                <p class="text-slate-700"><strong>Empresa:</strong> <span id="lbl-empresa" class="text-slate-600">--</span></p>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <form id="form-evaluacion" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. Credencial del Colaborador:</label>
                    <input type="text" id="input-credencial" required placeholder="Ingresa tu número de credencial (ej. 08001986)" 
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. Tipo de Registro:</label>
                    <select id="select-tipo" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Calificación (Estrellas)">Calificación (Estrellas)</option>
                        <option value="Queja / Reporte">Queja / Reporte</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. Puntuación:</label>
                    <div class="flex justify-center space-x-2 text-3xl text-slate-300 cursor-pointer py-1" id="star-rating">
                        <span onclick="setRating(1)" class="star transition">★</span>
                        <span onclick="setRating(2)" class="star transition">★</span>
                        <span onclick="setRating(3)" class="star transition">★</span>
                        <span onclick="setRating(4)" class="star transition">★</span>
                        <span onclick="setRating(5)" class="star transition">★</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Comentario u Observación:</label>
                    <textarea id="input-comentario" rows="3" placeholder="Escribe aquí tu opinión o reporte..." 
                              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <div id="msg-alerta" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

                <button type="submit" id="btn-enviar" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition duration-200">
                    Enviar Registro
                </button>

            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjfcesrsexuxyamoghsx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tkHpyaqmhlm8HuQvcVwzPg_Q0hehaPF'; // O la key que utilizaste antes
        const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedRating = 5;
        let idCamionActual = '02'; 

        // Detectar ?id_camion= de la URL escaneada
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('id_camion')) {
            idCamionActual = urlParams.get('id_camion').trim();
        }

        setRating(5);

        function setRating(rating) {
            selectedRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('text-amber-400');
                    star.classList.remove('text-slate-300');
                } else {
                    star.classList.add('text-slate-300');
                    star.classList.remove('text-amber-400');
                }
            });
        }

        async function obtenerDatosCamion() {
            try {
                const { data, error } = await clientSupabase
                    .from('choferes_unidades')
                    .select('*')
                    .eq('id_camion', idCamionActual)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    document.getElementById('lbl-camion').textContent = data.id_camion;
                    document.getElementById('lbl-chofer').textContent = data.nombre_chofer || 'Sin chofer asignado';
                    document.getElementById('lbl-empresa').textContent = data.empresa || 'IUSA Transportes';
                    document.getElementById('badge-camion').textContent = `Camión ${data.id_camion}`;
                    document.getElementById('badge-camion').className = "absolute top-3 right-3 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full";
                } else {
                    document.getElementById('lbl-camion').textContent = idCamionActual;
                    document.getElementById('lbl-chofer').textContent = 'Información no registrada';
                    document.getElementById('badge-camion').textContent = `Unidad ${idCamionActual}`;
                }
            } catch (err) {
                console.error("Error al obtener camión:", err);
                document.getElementById('lbl-camion').textContent = idCamionActual;
                document.getElementById('lbl-chofer').textContent = 'Camión ' + idCamionActual;
            }
        }

        document.getElementById('form-evaluacion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const msg = document.getElementById('msg-alerta');
            const credencial = document.getElementById('input-credencial').value.trim();

            btn.disabled = true;
            btn.textContent = "Verificando credencial...";
            msg.className = "hidden";

            try {
                // 1. Validar Credencial
                const { data: credValida } = await clientSupabase
                    .from('credenciales_validas')
                    .select('num_credencial')
                    .eq('num_credencial', credencial)
                    .maybeSingle();

                if (!credValida) {
                    msg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-red-100 text-red-700 block";
                    msg.textContent = "❌ Número de credencial no válido en el padrón de IUSA.";
                    btn.disabled = false;
                    btn.textContent = "Enviar Registro";
                    return;
                }

                // 2. Insertar Reporte
                btn.textContent = "Guardando...";
                const folio = "REP-" + Math.floor(100000 + Math.random() * 900000);

                const { error: errInsert } = await clientSupabase
                    .from('reportes_recibidos')
                    .insert([{
                        folio_reporte: folio,
                        id_camion: idCamionActual,
                        credencial_emisor: credencial,
                        tipo_envio: document.getElementById('select-tipo').value,
                        puntuacion: selectedRating,
                        comentario: document.getElementById('input-comentario').value,
                        fecha_hora: new Date().toISOString()
                    }]);

                if (errInsert) throw errInsert;

                msg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-emerald-100 text-emerald-800 block";
                msg.textContent = `¡Registro enviado exitosamente con folio ${folio}!`;
                document.getElementById('input-comentario').value = '';
                document.getElementById('input-credencial').value = '';

            } catch (err) {
                msg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-red-100 text-red-700 block";
                msg.textContent = "❌ Error al enviar: " + (err.message || err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar Registro";
            }
        });

        obtenerDatosCamion();
    </script>
</body>
</html>
