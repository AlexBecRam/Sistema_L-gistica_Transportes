<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - IUSA Transportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-grid, #printable-grid * { visibility: visible; }
            .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            #printable-grid { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr) !important; 
                gap: 15px !important; 
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- BARRA DE NAVEGACIÓN UNIFICADA -->
    <nav class="bg-slate-900 text-white shadow-lg border-b border-slate-800 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 text-white font-extrabold px-2.5 py-1 rounded text-sm tracking-wider">IUSA</div>
                <span class="font-bold text-lg tracking-wide text-slate-100">Control Logístico de Transporte</span>
            </div>
            <div class="flex space-x-2 text-sm font-medium">
                <a href="/" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">📊 Procesador Excel</a>
                <a href="/reportes" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">📝 Buzón de Quejas</a>
                <a href="/qr_generator" class="px-3 py-2 rounded-lg bg-blue-600 text-white font-semibold shadow-md">📷 Generador QR</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="mb-6 no-print">
            <h1 class="text-2xl font-bold text-slate-900">Generador de Códigos QR</h1>
            <p class="text-sm text-slate-500">Genera e imprime calcomanías individuales o por rangos de unidades para IUSA.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- PANEL DE CONTROL SIMPLE -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 no-print">
                <h2 class="text-base font-bold text-slate-800 border-b pb-2">Selección de Unidades</h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Camión o Rango de Camiones:</label>
                    <input type="text" id="input-unidades" value="01-04" placeholder="Ej. 02  ó  01-10  ó  01, 03, 05" 
                           class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold">
                    <p class="text-[11px] text-slate-400 mt-1.5 leading-tight">
                        • Único: <code class="text-slate-700">02</code><br>
                        • Rango: <code class="text-slate-700">01-10</code><br>
                        • Varios: <code class="text-slate-700">01, 04, 07</code>
                    </p>
                </div>

                <button onclick="procesarYGenerarQR()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow text-sm transition">
                    🔄 Generar Códigos QR
                </button>

                <hr class="my-2">

                <button onclick="window.print()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow text-sm transition flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H7a2 2 0 00-2 2v4h10z"></path></svg>
                    <span>🖨️ Imprimir Calcomanías</span>
                </button>
            </div>

            <!-- CONTENEDOR DE HOJA IMPRESA -->
            <div class="md:col-span-2">
                <div id="printable-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Se renderizan los QR automáticamente -->
                </div>
            </div>

        </div>

    </main>

    <script>
        const dominioActual = window.location.origin;

        function obtenerListaUnidades(entradatxt) {
            let unidades = [];
            entradatxt = entradatxt.trim();

            if (entradatxt.includes('-')) {
                // Es un rango (ej: 01-08)
                const partes = entradatxt.split('-');
                const inicio = parseInt(partes[0], 10);
                const fin = parseInt(partes[1], 10);

                if (!isNaN(inicio) && !isNaN(fin) && inicio <= fin) {
                    for (let i = inicio; i <= fin; i++) {
                        unidades.push(i < 10 ? '0' + i : '' + i);
                    }
                }
            } else if (entradatxt.includes(',')) {
                // Es una lista separada por comas (ej: 01, 03, 05)
                unidades = entradatxt.split(',').map(u => u.trim()).filter(u => u.length > 0);
            } else if (entradatxt.length > 0) {
                // Es una sola unidad (ej: 02)
                unidades.push(entradatxt);
            }

            return unidades.length > 0 ? unidades : ['01'];
        }

        function procesarYGenerarQR() {
            const inputVal = document.getElementById('input-unidades').value;
            const unidades = obtenerListaUnidades(inputVal);
            const gridContainer = document.getElementById('printable-grid');
            gridContainer.innerHTML = '';

            unidades.forEach((uni, index) => {
                const cardId = `qr-card-${index}`;
                const urlFinal = `${dominioActual}/evaluacion?id_camion=${encodeURIComponent(uni)}`;

                const cardHTML = `
                    <div class="bg-white p-5 rounded-2xl border-2 border-dashed border-slate-300 shadow-sm text-center flex flex-col items-center justify-between">
                        <div class="w-full border-b-2 border-red-600 pb-2 mb-2">
                            <span class="bg-red-600 text-white font-black px-2 py-0.5 rounded text-[10px] tracking-widest uppercase">IUSA</span>
                            <span class="font-extrabold text-slate-900 text-xs ml-1 tracking-tight">TRANSPORTE DE PERSONAL</span>
                        </div>

                        <div id="${cardId}" class="my-2 flex justify-center"></div>

                        <div class="w-full mt-2">
                            <div class="bg-slate-900 text-white py-1.5 rounded-lg font-extrabold text-lg mb-1 tracking-wide">
                                UNIDAD ${uni}
                            </div>
                            <p class="text-[10px] text-slate-600 font-medium">Escanea este código con tu celular para calificar o reportar.</p>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);

                new QRCode(document.getElementById(cardId), {
                    text: urlFinal,
                    width: 140,
                    height: 140,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });
        }

        // Generar al cargar inicialmente
        procesarYGenerarQR();
    </script>
</body>
</html>
